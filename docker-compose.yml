services:

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - api

    networks:
      - aayes

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - "3001:3001"
    environment:

    networks:
      - aayes

  # 🔴 Redis optional (future use)
  redis:
    image: redis:7
    container_name: aayes_redis
    ports:
      - "6379:6379"
    networks:
      - aayes

networks:
  aayes:
    driver: bridge